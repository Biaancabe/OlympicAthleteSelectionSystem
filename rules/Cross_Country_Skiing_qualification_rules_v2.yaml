Description: "Cross Country Skiing Qualification Rules for Olympic Games 2026"
created at: 2025-12-16
updated at: 2026-01-22
version: "1.1"

# No class filter at file level, on purpose: the U23 World Championships (route 2)
# must stay evaluable, so U23 results are not filtered out. The U23 competition is
# identified by its competition name, not by a class filter.
#
# TARGET DISCIPLINE (Zieldisziplin): the concept requires the criteria to be met
# within one target discipline, Sprint or Distance. Each route is therefore split
# into a _sprint and a _distance variant via the route-level 'discipline' filter,
# so both conditions of a route only count results from the same family.
#   Sprint   : Sprint Classic Style
#   Distance : 10km Freestyle, 20km Skiathlon, 50km Classic Style
# Technique note: the only sprint discipline in the data is classic, so the
# concept rule 'at least one classical result for individual sprint' is satisfied
# automatically. If a freestyle sprint ever appears, this must be handled explicitly.
#
# Only individual (singles) disciplines are considered here. Relay / team entries
# are excluded; teams are formed from athletes who qualified in singles.

rule_tree:
  description: "Qualification Criteria for Cross Country Skiing at Olympic Games 2026"
  sport: "Cross-Country Skiing"

  # All routes are group 1 main criteria (priority 1). Each route exists twice:
  # once for Sprint, once for Distance (see header note).
  criteria:
    # Route 1 (Sprint): Top-3 WM 2025 + Top-30 WC 25/26
    - criterion_id: "cross_country_skiing_r1_sprint"
      description: "Top-3 WM 2025 + Top-30 WC 25/26 (Sprint)"
      discipline: ["Sprint Classic Style"]
      priority: 1
      conditions:
        - condition_id: "cross_country_skiing_r1_c1_sprint"
          description: "Top-3 WM 2025"
          competition: ["FIS Nordic World Ski Championships"]
          date: ["2025-02-26", "2025-03-09"]
          performance:
            metric: rank
            operator: between
            min: 1
            max: 3
          count_at_least: 1
        - condition_id: "cross_country_skiing_r1_c2_sprint"
          description: "Top-30 WC 25/26"
          competition: ["FIS Cross-Country World Cup"]
          date: ["2025-08-01", "2026-01-25"]
          performance:
            metric: rank
            operator: between
            min: 1
            max: 30
          count_at_least: 1

