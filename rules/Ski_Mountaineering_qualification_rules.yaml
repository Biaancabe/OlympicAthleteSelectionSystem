Description: "Ski Mountaineering Qualification Rules for Olympic Games 2026"
created at: 2025-12-18
updated at: 2026-01-22
version: "1.1"

# Concept 4.4 (sprint), three main criteria (OR), both genders:
#   r1: Top 2 at the Sprint World Championships 2025
#   r2: Top 4 in the national olympic sprint ranking. The federation computes this
#       ranking (points scale over the 4 best sprint WC/WM results) externally; it
#       arrives in the data as a 'National Ranking' competition with ready ranks.
#   r3: Top 2 mixed relay team at the World Championships 2025 (4.6: relay selection
#       derives from meeting a sprint main criterion). The relay is a team result;
#       the individual members carry the team rank, so it is evaluated per member.
# Discipline filters keep sprint and relay apart.

rule_tree:
  description: "Qualification Criteria for Ski Mountaineering at Olympic Games 2026"
  sport: "Ski Mountaineering"
  class: "Seniors"

  criteria:
    # Top-2 Sprint WM 2025
    - criterion_id: "ski_mountaineering_r1"
      description: "Top-2 Sprint WM 2025"
      discipline: ["Sprint"]
      priority: 1
      conditions:
        - condition_id: "ski_mountaineering_r1_c1"
          description: "Top-2 Sprint WM 2025"
          competition: ["ISMF World Championships"]
          date: ["2025-03-02", "2025-03-08"]
          performance:
            metric: rank
            operator: between
            min: 1
            max: 2
          count_at_least: 1

    # Top-4 National Ranking 2026
    - criterion_id: "ski_mountaineering_r2"
      description: "Top-4 National Ranking 2026"
      discipline: ["Sprint"]
      priority: 1
      conditions:
        - condition_id: "ski_mountaineering_r2_c1"
          description: "Top-4 National Ranking 2026"
          competition: ["National Ranking"]
          date: ["2026-01-01", "2026-01-15"]
          performance:
            metric: rank
            operator: between
            min: 1
            max: 4
          count_at_least: 1

    # Top-2 Mixed Relay WM 2025
    - criterion_id: "ski_mountaineering_r3"
      description: "Top-2 Mixed Relay WM 2025"
      discipline: ["Relay"]
      priority: 1
      conditions:
        - condition_id: "ski_mountaineering_r3_c1"
          description: "Top-2 Mixed Relay WM 2025"
          competition: ["ISMF World Championships"]
          date: ["2025-03-02", "2025-03-08"]
          performance:
            metric: rank
            operator: between
            min: 1
            max: 2
          count_at_least: 1