Description: "Ski Jumping Qualification Rules for Olympic Games 2026"
created at: 2025-12-16
updated at: 2026-01-22
version: "1.1"

# Two parallel route sets, one per gender, because the men's and women's concepts differ:
#   - selection end date: men 18.01.2026, women 25.01.2026
#   - Ski Flying World Championships (r5/r6): men only
#   - Continental Cup route (r8): men 'Continental Cup', women 'Inter-Continental Cup';
#     both map to the single data name 'FIS Ski Jumping Continental Cup'.
# Routes are filtered per gender via the 'gender' field.
#
# A list in 'competition' means OR. The World Cup appears in the data under two names,
# the regular one and the Four Hills Tournament combined name; both are always listed.
# All routes are group 1 main criteria (priority 1).

rule_tree:
  description: "Qualification Criteria for Ski jumping at Olympic Games 2026"
  sport: "Ski jumping"

  criteria:
    # ---------- MEN (selection end 18.01.2026) ----------
    # Men, Top-10 WM 2025 + Top-25 WC/SG
    - criterion_id: "ski_jumping_m_r1"
      description: "Top-10 WM 2025 + Top-25 WC/SG"
      gender: ["Men"]
      priority: 1
      conditions:
        - condition_id: "ski_jumping_m_r1_c1"
          description: "Top-10 WM 2025"
          competition: ["FIS Nordic World Ski Championships"]
          date: ["2025-02-26", "2025-03-09"]
          performance:
            metric: rank
            operator: between
            min: 1
            max: 10
          count_at_least: 1
        - condition_id: "ski_jumping_m_r1_c2"
          description: "Top-25 WC/SG 25/26"
          competition: ["Viesmann FIS Ski Jumping World Cup", "Four Hills Tournament/Viesmann FIS Ski Jumping World Cup", "FIS Sommer Grand Prix"]
          date: ["2025-07-15", "2026-01-18"]
          performance:
            metric: rank
            operator: between
            min: 1
            max: 25
          count_at_least: 1

