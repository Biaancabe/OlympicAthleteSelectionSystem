        count_at_least: 1
      - condition_id: "arc_g1_men_cont_rank"
        description: "Top-8 at European Games / Euros / University Games"
        competition: ["European Games", "European Archery Championships", "World University Games"]
        date: ["2023-06-23", "2024-06-30"]
        performance: { metric: rank, operator: less_or_equal, value: 8 }
        count_at_least: 1

