Description: "Athletics Qualification Rules for Olympic Games 2024"
created at: 2026-08-11
updated at: 2026-08-11

version: "0.1"

# Summer Games pilot (Paris 2024). Main criteria only (Selektionskonzept 4.5):
# achieving the entry standard (Limite, 4.6) within the qualification window (4.3).
# The World-Ranking invitation path is NOT machine-evaluable from results -> out
# of scope, document in Chapter 6.
#
#
# Discipline names ("100m", "Decathlon", "Heptathlon") and competition names are
# placeholders -> confirm against real Gracenote data / map via aliases.
#
# Age gate: "born after 31.12.YYYY -> not eligible" == born on_or_before that date.

rule_tree:
  description: "Qualification Criteria for Athletics at Olympic Games 2024"
  sport: "Athletics"
  class: "Seniors"

  criteria:
    # --- 100m: time threshold + general age gate (born on/before 2008-12-31) ---
    - criterion_id: "ath_100m_men"
      description: "100m Men - entry standard 10.00s"
      priority: 1
      gender: ["Men"]
      discipline: ["100m"]
      conditions:
      - condition_id: "ath_100m_men_c1"
        description: "<= 10.00s at a World Ranking Competition"
        competition: []
        date: ["2023-07-01", "2024-06-30"]
        performance: { metric: time, operator: less_or_equal, value: 10.00 }
        age: { metric: birth_date, operator: on_or_before, value: "2008-12-31" }
        count_at_least: 1

    - criterion_id: "ath_100m_women"
      description: "100m Women - entry standard 11.07s"
      priority: 1
      gender: ["Women"]
      discipline: ["100m"]
      conditions:
      - condition_id: "ath_100m_women_c1"
        description: "<= 11.07s at a World Ranking Competition"
        competition: []
        date: ["2023-07-01", "2024-06-30"]
        performance: { metric: time, operator: less_or_equal, value: 11.07 }
        age: { metric: birth_date, operator: on_or_before, value: "2008-12-31" }
        count_at_least: 1

    # --- Combined events: points threshold + stricter age gate (on/before 2006-12-31) ---
    - criterion_id: "ath_decathlon_men"
      description: "Decathlon Men - entry standard 8460 pts"
      priority: 1
      gender: ["Men"]
      discipline: ["Decathlon"]
      conditions:
      - condition_id: "ath_decathlon_men_c1"
        description: ">= 8460 points at a World Ranking Competition"
        competition: []
        date: ["2022-12-31", "2024-06-30"]
        performance: { metric: points, operator: greater_or_equal, value: 8460 }
        age: { metric: birth_date, operator: on_or_before, value: "2006-12-31" }
        count_at_least: 1

    - criterion_id: "ath_heptathlon_women"
      description: "Heptathlon Women - entry standard 6480 pts"
      priority: 1
      gender: ["Women"]
      discipline: ["Heptathlon"]
      conditions:
      - condition_id: "ath_heptathlon_women_c1"
        description: ">= 6480 points at a World Ranking Competition"
        competition: []
        date: ["2022-12-31", "2024-06-30"]
        performance: { metric: points, operator: greater_or_equal, value: 6480 }
        age: { metric: birth_date, operator: on_or_before, value: "2006-12-31" }
        count_at_least: 1